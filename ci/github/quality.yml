# Enforces: POL-6.2 (Quality Gates Are Inviolable) — lint, type-check,
# tests+coverage (POL-3.2), format check (POL-2.2).
# Installed into .github/workflows/ by scripts/install.sh.
name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (Policy Domain 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint (POL-2.1, 2.3, 2.4, 2.5, 4.3)
        run: npm run lint

  type-check:
    name: Type Check (POL-2.3/2.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: tsc --noEmit (strict per tsconfig.base.json)
        run: npm run type-check

  test:
    name: Tests + Coverage Floors (POL-3.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Jest with coverage thresholds (80/100/70 — build fails below floor)
        run: npm test -- --coverage

  format:
    name: Format Check (POL-2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prettier check (formatting is never manual)
        run: npx prettier --check .

# POL-6.2: all four jobs are required status checks on protected branches.
# There is no override path — a red gate is fixed, never bypassed.
